services:
  reverse-proxy:
    build: ReverseProxy
    expose:
      - "80"
    depends_on:
    - front-end
    - core
    - map
    ports:
      - "80:80"

  front-end:
    build: ../FrontendMicroservice/front-end
    expose:
    - "8000"
  
  core:
    build: ../CoreMicroservice/
    expose:
     - "8000"
    depends_on:
      - db
    env_file: ".env"

  scheduler:
    build: ../CoreMicroservice/scheduler
     
  voting:
    build: ../VotingMicroservice
    expose:
     - "8085"
    env_file: ".env"
    depends_on:
      - db

  email:
    build: ../EmailMicroservice
    expose:
     - "8081"
    env_file: ".env"

  mailhog:
    image: mailhog/mailhog
    expose:
     - "8025"
     - "1025"
    ports:
      - "8025:8025"

  map:
    build: ../MapMicroservice/map-service
    env_file: ".env"
    expose:
     - "8080"
    depends_on:
      - db

  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: db
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - core_data:/var/lib/postgresql

  migration-core:
    build: ../CoreMicroservice/
    command: ["python3", "manage.py", "migrate"]
    depends_on:
      - db
    env_file: ".env"
    
volumes:
  core_data: